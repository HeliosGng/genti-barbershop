# Google Cloud Build configuration for Genti's Barbershop
# Automatically builds container image and deploys to Google Cloud Run

steps:
  # 1. Build the Docker container image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/gentis-barbershop:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/gentis-barbershop:latest'
      - '.'

  # 2. Push image to Google Container / Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/gentis-barbershop:$COMMIT_SHA'

  # 3. Deploy container image to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'gentis-barbershop'
      - '--image'
      - 'gcr.io/$PROJECT_ID/gentis-barbershop:$COMMIT_SHA'
      - '--region'
      - 'europe-west1' # Frankfurt/Belgium (nearest high-speed EU region)
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--min-instances'
      - '0'
      - '--max-instances'
      - '10'
      - '--memory'
      - '256Mi'
      - '--cpu'
      - '1'

images:
  - 'gcr.io/$PROJECT_ID/gentis-barbershop:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/gentis-barbershop:latest'

timeout: '600s'
